server:
  port: 8080

spring:
  application:
    name: guide-system
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/guide?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:192.168.193.131}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

minio:
  endpoint: ${MINIO_ENDPOINT:http://192.168.193.131:9000}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:guide}

# 向量库（PostgreSQL + pgvector）——管语义，独立于上面 MySQL 主数据源；
# 写入方：kb（RAG 语料）与 feedback（聚类锚点，见数据库设计 4.1）
pgvector:
  url: jdbc:postgresql://${PGVECTOR_HOST:192.168.193.131}:${PGVECTOR_PORT:5432}/${PGVECTOR_DB:guide_vec}
  username: ${PGVECTOR_USER:postgres}
  password: ${PGVECTOR_PASSWORD:}
  # 与阿里 text-embedding-v3 对齐；换 embedding 模型需同步改维度并重建向量
  dimension: ${PGVECTOR_DIM:1024}

# Elasticsearch——chunk 全文检索（BM25）+ 医疗术语聚合；写入方：kb（唯一写入口）
elasticsearch:
  uris: ${ES_URIS:http://192.168.193.131:9200}
  username: ${ES_USERNAME:}
  password: ${ES_PASSWORD:}
  chunk-index: ${ES_CHUNK_INDEX:guide_chunk}

# 演示种子数据（开发夹具）：默认开启，启动时装载 7 科室语料 + 术语白名单（科室表非空即跳过，幂等）
# 它是科室/语料的唯一默认来源——关掉且尚未走链路 B 上传流水线时，挂号页会无科室可选
# 链路 B 上传流水线就绪后置 false
guide:
  seed:
    enabled: ${GUIDE_SEED_ENABLED:true}

mybatis-plus:
  # 枚举包：@EnumValue 标注的编码字段自动装载（见《数据库设计.md》§0）
  type-enums-package: com.guide.auth.enums,com.guide.chat.enums,com.guide.kb.enums,com.guide.feedback.enums,com.guide.async.enums
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 真实密钥放 application-local.yml（不提交），此处只用占位符
# JWT（链路 D）：secret 为 HS256 密钥（至少 32 字符）；登录态存 Redis，登出/过期即时失效
jwt:
  secret: ${JWT_SECRET:}
  expire-hours: ${JWT_EXPIRE_HOURS:24}
  redis-key-prefix: ${JWT_REDIS_KEY_PREFIX:auth:token:}

llm:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
    embedding-model: ${EMBEDDING_MODEL:text-embedding-v3}
    rerank-model: ${RERANK_MODEL:qwen3-rerank}
